<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abrir Chamado - TI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/abrir-chamado.css" />
</head>
<body>

    <main class="card">
        <header class="header">
            <div class="left">
                <div class="icon-circle"><i class="fas fa-headset"></i></div>
                <h1>
                    Abrir Chamado
                    <small>Suporte de TI — Registre sua solicitação</small>
                </h1>
            </div>
            <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sair</button>
        </header>

        <form id="chamadoForm" novalidate>
            <div class="form-row">
                <div class="form-group">
                    <label for="solicitante">Solicitante <span class="required">*</span></label>
                    <input type="text" id="solicitante" placeholder="Seu nome completo" required />
                </div>
                <div class="form-group">
                    <label for="email">E-mail <span class="required">*</span></label>
                    <input type="email" id="email" placeholder="seu@email.com" required />
                </div>
            </div>
            <div class="form-group">
                <label for="titulo">Título do chamado <span class="required">*</span></label>
                <input type="text" id="titulo" placeholder="Ex: Impressora não funciona" required />
            </div>
            <div class="form-group">
                <label for="descricao">Descrição detalhada <span class="required">*</span></label>
                <textarea id="descricao" placeholder="Descreva o problema com o máximo de detalhes..." required></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="prioridade">Prioridade</label>
                    <select id="prioridade">
                        <option value="Baixa">Baixa</option>
                        <option value="Média" selected>Média</option>
                        <option value="Alta">Alta</option>
                        <option value="Crítica">Crítica</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <select id="categoria">
                        <option value="Hardware">Hardware</option>
                        <option value="Software" selected>Software</option>
                        <option value="Rede">Rede</option>
                        <option value="Segurança">Segurança</option>
                        <option value="Outros">Outros</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="anexo">Anexo (opcional)</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="anexo" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" />
                    <div class="file-upload-box">
                        <i class="fas fa-paperclip"></i>
                        <span>Selecionar arquivo</span>
                        <span class="file-name" id="fileName">nenhum arquivo</span>
                    </div>
                </div>
            </div>
            <button type="submit" class="btn-submit" id="btnSubmit">
                <i class="fas fa-paper-plane"></i> Abrir Chamado
            </button>
        </form>
    </main>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Chamado aberto com sucesso!</span>
    </div>

    <script src="js/abrir-chamado.js"></script>

</body>
</html>
